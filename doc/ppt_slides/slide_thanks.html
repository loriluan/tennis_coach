<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:720pt;height:405pt;background:#1A3550;font-family:Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;position:relative;}
.ring{position:absolute;border-radius:50%;border:1pt solid rgba(0,212,255,0.1);}
.r1{width:260pt;height:260pt;}
.r2{width:200pt;height:200pt;}
.r3{width:140pt;height:140pt;}
.inner{width:90pt;height:90pt;border-radius:50%;background:rgba(0,212,255,0.1);border:2pt solid #00D4FF;display:flex;align-items:center;justify-content:center;font-size:34pt;z-index:1;margin-bottom:20pt;}
h2{font-size:28pt;color:#fff;font-weight:bold;z-index:1;margin-bottom:8pt;}
.bar{width:40pt;height:2pt;background:#00D4FF;margin-bottom:12pt;z-index:1;}
.sub{font-size:14pt;color:#CBD5E1;z-index:1;}
</style></head><body>
<div class="ring r1"></div>
<div class="ring r2"></div>
<div class="ring r3"></div>
<div class="inner"><p>🎾</p></div>
<h2>感谢聆听</h2>
<div class="bar"></div>
<p class="sub">欢迎提问与交流</p>
</body></html>
