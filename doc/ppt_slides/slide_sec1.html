<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:720pt;height:405pt;background:#1A3550;font-family:Arial,sans-serif;display:flex;overflow:hidden;}
.stripe{position:absolute;left:0;top:0;width:8pt;height:100%;background:#00D4FF;}
.left{width:320pt;display:flex;flex-direction:column;justify-content:center;padding:0 44pt 0 52pt;z-index:1;}
.label{font-size:9pt;color:#00D4FF;letter-spacing:4px;margin-bottom:10pt;}
h2{font-size:22pt;color:#fff;font-weight:bold;margin-bottom:14pt;}
.bar{width:40pt;height:2pt;background:#00D4FF;margin-bottom:16pt;}
.items{display:flex;flex-direction:column;gap:9pt;}
.item{font-size:11pt;color:#CBD5E1;}
.right{flex:1;}
</style></head><body>
<div class="stripe"></div>
<div class="left">
  <p class="label">SECTION ONE</p>
  <h2>项目目标</h2>
  <div class="bar"></div>
  <div class="items">
    <p class="item">› 研究背景</p>
    <p class="item">› 目标与意义</p>
  </div>
</div>
<div class="right"></div>
</body></html>
