<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:720pt;height:405pt;background:#1A3550;font-family:Arial,sans-serif;display:flex;overflow:hidden;}
.left{width:380pt;height:405pt;display:flex;flex-direction:column;justify-content:center;padding:0 44pt;flex-shrink:0;}
.tag{font-size:11pt;color:#00D4FF;letter-spacing:2px;margin-bottom:8pt;}
h1{font-size:22pt;color:#fff;font-weight:bold;line-height:1.4;margin-bottom:12pt;}
.bar{width:30pt;height:2pt;background:#00D4FF;border-radius:2pt;margin-bottom:12pt;}
.en{font-size:12pt;color:#94A3B8;}
.right{flex:1;display:flex;align-items:center;justify-content:center;}
.outer{width:130pt;height:130pt;border-radius:50%;border:1pt solid rgba(0,212,255,0.3);display:flex;align-items:center;justify-content:center;}
.mid{width:100pt;height:100pt;border-radius:50%;border:1pt solid rgba(0,212,255,0.15);display:flex;align-items:center;justify-content:center;}
.inner{width:74pt;height:74pt;border-radius:50%;background:#1E3A55;border:1pt solid #00D4FF;display:flex;align-items:center;justify-content:center;font-size:32pt;}
</style></head><body>
<div class="left">
  <p class="tag">科技创新课题答辩</p>
  <h1>基于计算机视觉与大语言模型的网球动作智能教练系统</h1>
  <div class="bar"></div>
  <p class="en">Tennis Action Intelligent Coaching System · CV × LLM</p>
</div>
<div class="right">
  <div class="outer">
    <div class="mid">
      <div class="inner"><p>🎾</p></div>
    </div>
  </div>
</div>
</body></html>
