<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:720pt;height:405pt;background:#1A3550;font-family:Arial,sans-serif;display:flex;flex-direction:column;padding:18pt 28pt 14pt;overflow:hidden;}
.top{display:flex;align-items:center;gap:4pt;margin-bottom:12pt;}
.accent{width:4pt;height:22pt;background:#00D4FF;border-radius:2pt;}
h2{font-size:20pt;color:#fff;font-weight:bold;}
.cols{display:flex;gap:12pt;flex:1;}
.col{flex:1;display:flex;flex-direction:column;gap:7pt;}
.divider{width:1pt;background:#1E3A5F;flex-shrink:0;}
.col-hdr{border-radius:6pt;padding:6pt 12pt;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.c1h{background:rgba(16,185,129,0.15);border:1.5pt solid rgba(16,185,129,0.4);}
.c2h{background:rgba(249,115,22,0.12);border:1.5pt solid rgba(239,68,68,0.4);}
.hdr-title{font-size:12pt;font-weight:bold;color:#fff;}
.score{font-size:18pt;font-weight:bold;letter-spacing:-0.5px;}
.sh{color:#10B981;}.sl{color:#F97316;}
.img-labels{display:flex;gap:6pt;flex-shrink:0;}
.img-label{flex:1;font-size:8pt;color:#475569;text-align:center;padding:2pt 0;}
.img-label.wide{flex:2;}
.spacer{flex:1;}
.finding{border-radius:5pt;padding:5pt 12pt;font-size:10pt;font-weight:500;flex-shrink:0;border-left:3pt solid;}
.f1{background:rgba(16,185,129,0.08);color:#6EE7B7;border-color:#10B981;}
.f2{background:rgba(239,68,68,0.08);color:#FCA5A5;border-color:#F97316;}
</style></head><body>
<div class="top">
  <div class="accent"></div>
  <h2>实验一二：图片输入对比</h2>
</div>
<div class="cols">
  <div class="col">
    <div class="col-hdr c1h">
      <p class="hdr-title">实验一 · 规范示范</p>
      <p class="score sh">100分</p>
    </div>
    <div class="spacer"></div>
    <div class="img-labels">
      <p class="img-label">输入图片</p>
      <p class="img-label">关键点检测</p>
      <p class="img-label wide">评分 &amp; LLM分析</p>
    </div>
    <div class="finding f1"><p>✓ 所有关节角度达标，动作规范 · LLM 正向评价</p></div>
  </div>
  <div class="divider"></div>
  <div class="col">
    <div class="col-hdr c2h">
      <p class="hdr-title">实验二 · 不规范示范</p>
      <p class="score sl">68分</p>
    </div>
    <div class="spacer"></div>
    <div class="img-labels">
      <p class="img-label">输入图片</p>
      <p class="img-label">关键点检测</p>
      <p class="img-label wide">评分 &amp; LLM分析</p>
    </div>
    <div class="finding f2"><p>✗ 右肘角 36.9°（标准 122.5°），偏差 −85.6° · 针对性建议</p></div>
  </div>
</div>
</body></html>
